# Feed sources, ported from DefaultSources.json.
#
# Each entry needs a unique `slug` (used in the output filename and URL),
# a `name`, and a `homepage`. `feed_url` defaults to `homepage + /feed`
# (Substack convention) — set it explicitly if a source lives elsewhere.
# `author` and `category` are optional metadata.

defaults:
  feed_path: /feed     # appended to homepage when feed_url is omitted
  max_items: 50        # max items kept per source per run

