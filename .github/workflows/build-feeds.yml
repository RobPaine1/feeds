name: Build feeds

on:
  schedule:
    # Three times a day, ~13 minutes past the hour to avoid the top-of-hour
    # cron rush on GitHub-hosted runners (which often delays or silently drops
    # :00 triggers). 01:13, 14:13, and 19:13 UTC ≈ ~6pm/7am/12pm Pacific.
    - cron: "13 1,14,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feeds
        env:
          # Pages base URL is used in <atom:link rel=self> and OPML xmlUrl entries.
          PAGES_BASE: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          # IMAP creds for the email-newsletter pipeline. Set as GitHub secrets;
          # if either is empty, the email step is silently skipped.
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
        run: python generate.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/ opml.xml index.html feed_state.json
          [ -f unknown_senders.json ] && git add unknown_senders.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh feeds [skip ci]"
            git push
          fi
