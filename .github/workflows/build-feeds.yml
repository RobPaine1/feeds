name: Build feeds

on:
  schedule:
    # Three times a day at 14:00, 19:00, and 01:00 UTC
    # ≈ 7am / 12pm / 6pm Pacific (off by an hour around DST shifts).
    - cron: "0 1,14,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feeds
        env:
          # Pages base URL is used in <atom:link rel=self> and OPML xmlUrl entries.
          PAGES_BASE: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: python generate.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/ opml.xml index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh feeds [skip ci]"
            git push
          fi
