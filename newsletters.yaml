# Email newsletter sources.
#
# Each entry maps a sender (matched by case-insensitive substring of the
# From: header) to a feed slug, just like sources.yaml maps a homepage to
# a feed slug. Subscribe newsletters to your dedicated Gmail account, wait
# for an issue to arrive, then add an entry below.
#
# Senders not matched by any entry are written to `unknown_senders.json`
# (committed by CI) so you can see what's hitting the inbox and decide
# whether to add them.
#
# Required env vars (set as GitHub Actions secrets):
#   IMAP_USER  — full email address of the dedicated account
#   IMAP_PASS  — Gmail App Password (NOT your normal password)
#
# To create an App Password:
#   1. Enable 2-Step Verification on the Gmail account.
#   2. https://myaccount.google.com/apppasswords  → create one for "Mail".
#   3. Paste the 16-character password into the GitHub repo secret IMAP_PASS.

newsletters:
  - slug: axios-ai-plus
    name: Axios AI+
    homepage: https://www.axios.com/newsletters/axios-ai-plus
    match: ai.plus@axios.com         # exact sender, won't catch other Axios newsletters

  - slug: politico-weekly-agriculture
    name: POLITICO's Weekly Agriculture
    homepage: https://www.politico.com/newsletters/weekly-agriculture
    match: weeklyagriculture@email.politico.com
